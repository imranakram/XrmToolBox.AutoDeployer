version: 2

updates:
  # The plugin and its tests. Both pin XrmToolBoxPackage, so updates are grouped to keep them in step.
  # The test bench projects under Tests/TestBench are only deployed as test files and are left out.
  - package-ecosystem: nuget
    directories:
      - /XrmToolBox.AutoDeployer
      - /Tests/XrmToolBox.AutoDeployer.Tests
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns:
          - '*'
    open-pull-requests-limit: 5

  # Action versions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
