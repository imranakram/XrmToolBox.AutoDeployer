version: 2

updates:
  # The plugin and its tests. Both pin XrmToolBoxPackage, so updates are grouped to keep them in step.
  # The test bench projects under Tests/TestBench are only deployed as test files and are left out.
  - package-ecosystem: nuget
    directories:
      - /XrmToolBox.AutoDeployer
      - /Tests/XrmToolBox.AutoDeployer.Tests
    schedule:
      interval: weekly
    # Only these. The other packages (System.Text.Json, Microsoft.Extensions.*, Newtonsoft.Json,
    # MscrmTools.Xrm.Connection, ...) ship with XrmToolBox itself and are pinned to the versions it
    # uses, so they're updated by hand together with XrmToolBoxPackage.
    allow:
      - dependency-name: XrmToolBoxPackage
      - dependency-name: NUnit
      - dependency-name: NUnit3TestAdapter
    groups:
      nuget:
        patterns:
          - '*'
    open-pull-requests-limit: 5

  # Action versions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
